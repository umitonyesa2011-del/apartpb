name: Публикация сайта

# Сайт отдаётся с ветки gh-pages. Этот workflow держит её в актуальном
# состоянии: любой пуш в main переносится в gh-pages, и GitHub Pages
# пересобирает сайт автоматически.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Перенести main в gh-pages
        run: git push --force origin HEAD:gh-pages
